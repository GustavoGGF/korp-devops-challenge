global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: "http-server-projeto-korp"
    scrape_interval: 5s
    scrape_timeout: 4s
    metrics_path: /metrics
    static_configs:
      - targets: ["http-server-projeto-korp:8080"]
        labels:
          app: "http-server-projeto-korp"
          env: "production"
