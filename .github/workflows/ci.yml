name: CI Pipeline

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    name: Test & Quality (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify code formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Arquivos fora do padrão gofmt:"
            gofmt -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -v -race -coverpkg=./... -coverprofile=coverage.txt ./tests/...

  docker-build-and-test:
    name: Docker Build & Smoke Test
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: http-server-projeto-korp:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --name test-app -p 8080:8080 http-server-projeto-korp:test
          sleep 2
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/projeto-korp)
          if [ "$RESPONSE" != "200" ]; then
            echo "Falha no smoke test: status HTTP retornado foi $RESPONSE"
            docker logs test-app
            exit 1
          fi
          echo "Smoke test validado com sucesso (HTTP 200)!"

      - name: Security scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: http-server-projeto-korp:test
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
