---
# ==============================================================================
# Tasks da Role Docker: Pré-validação e Instalação Idempotente
# ==============================================================================

- name: Validar compatibilidade da distribuição Linux
  ansible.builtin.assert:
    that:
      - ansible_distribution in ['Ubuntu', 'Debian']
      - ansible_architecture in ['x86_64', 'aarch64', 'arm64']
    fail_msg: >-
      Distribuição '{{ ansible_distribution }}' ou arquitetura '{{ ansible_architecture }}'
      não suportada. Suporte oficial para Ubuntu 22.04/24.04 ou Debian 12 em x86_64/arm64.
    success_msg: "Host compatível: {{ ansible_distribution }} {{ ansible_distribution_version }} ({{ ansible_architecture }})"
  tags: [docker, validation]

- name: Validar memória mínima disponível
  ansible.builtin.assert:
    that:
      - ansible_memtotal_mb >= min_memory_mb
    fail_msg: >-
      Memória RAM insuficiente ({{ ansible_memtotal_mb }} MB).
      O ambiente requer no mínimo {{ min_memory_mb }} MB.
    success_msg: "Memória verificada: {{ ansible_memtotal_mb }} MB (mínimo {{ min_memory_mb }} MB)"
  tags: [docker, validation]

- name: Remover pacotes legados e conflitantes do Docker
  ansible.builtin.apt:
    name: "{{ docker_packages_legacy }}"
    state: absent
    purge: false
  tags: [docker]

- name: Instalar dependências pré-requisito para repositório APT
  ansible.builtin.apt:
    name: "{{ docker_apt_prereqs }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [docker]

- name: Garantir diretório de keyrings APT
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [docker]

- name: Baixar chave GPG oficial do Docker
  ansible.builtin.get_url:
    url: "{{ docker_apt_gpg_url }}"
    dest: "{{ docker_apt_keyring_path }}"
    owner: root
    group: root
    mode: "0644"
    force: false
  tags: [docker]

- name: Adicionar repositório oficial do Docker ao APT
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }} signed-by={{ docker_apt_keyring_path }}]
      https://download.docker.com/linux/{{ ansible_distribution | lower }}
      {{ ansible_distribution_release }} stable
    state: present
    filename: docker
    update_cache: true
  tags: [docker]

- name: Instalar Docker CE, CLI, containerd e plugins Compose/Buildx
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
  tags: [docker]

- name: Garantir que o serviço Docker está habilitado e em execução
  ansible.builtin.service:
    name: docker
    state: "{{ docker_service_state }}"
    enabled: "{{ docker_service_enabled }}"
  tags: [docker]

- name: Adicionar usuários operacionais ao grupo docker
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
  when:
    - docker_users is defined
    - item != 'root'
  tags: [docker]

- name: Verificar versão do Docker instalada
  ansible.builtin.command: docker --version
  register: docker_version_output
  changed_when: false
  tags: [docker]

- name: Verificar versão do Docker Compose Plugin instalada
  ansible.builtin.command: docker compose version
  register: docker_compose_version_output
  changed_when: false
  tags: [docker]

- name: Exibir versões do Docker instaladas
  ansible.builtin.debug:
    msg:
      - "Docker: {{ docker_version_output.stdout }}"
      - "Compose: {{ docker_compose_version_output.stdout }}"
  tags: [docker]
