---
# Defaults para a role docker
docker_packages_legacy:
  - docker.io
  - docker-doc
  - docker-compose
  - podman-docker
  - containerd
  - runc

docker_apt_prereqs:
  - ca-certificates
  - curl
  - gnupg

docker_apt_keyring_path: /etc/apt/keyrings/docker.asc
docker_apt_repo_file: /etc/apt/sources.list.d/docker.list
docker_apt_gpg_url: https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg

docker_service_state: started
docker_service_enabled: true
