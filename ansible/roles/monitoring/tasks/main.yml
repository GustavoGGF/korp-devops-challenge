---
# ==============================================================================
# Tasks da Role Monitoring: Configuração e Regras do Prometheus
# ==============================================================================

- name: Garantir diretórios de configuração do Prometheus
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ file_owner }}"
    group: "{{ file_group }}"
    mode: "0755"
  loop:
    - "{{ monitoring_prometheus_dir }}"
    - "{{ monitoring_prometheus_rules_dir }}"
  tags: [monitoring]

- name: Renderizar configuração do Prometheus (prometheus.yml)
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ monitoring_prometheus_conf_file }}"
    owner: "{{ file_owner }}"
    group: "{{ file_group }}"
    mode: "0644"
  notify: Reload prometheus
  tags: [monitoring]

- name: Renderizar regras de alerta do Prometheus (alerts.yml)
  ansible.builtin.template:
    src: alerts.yml.j2
    dest: "{{ monitoring_prometheus_alerts_file }}"
    owner: "{{ file_owner }}"
    group: "{{ file_group }}"
    mode: "0644"
  notify: Reload prometheus
  tags: [monitoring]

- name: Verificar se container do Prometheus está em execução
  ansible.builtin.command:
    cmd: "docker compose -f {{ application_compose_file_dest | default(compose_file_dest) }} ps -q prometheus"
  register: monitoring_prometheus_running_check
  changed_when: false
  failed_when: false
  tags: [monitoring]

- name: Validar sintaxe da configuração do Prometheus no container em execução
  ansible.builtin.command:
    cmd: >-
      docker compose -f {{ application_compose_file_dest | default(compose_file_dest) }}
      exec -T prometheus promtool check config /etc/prometheus/prometheus.yml
  when:
    - monitoring_prometheus_running_check.stdout | length > 0
  changed_when: false
  tags: [monitoring]
